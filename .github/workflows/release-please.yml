name: Release Please

on:
  push:
    branches:
      - main

# The App token carries the write permissions — GITHUB_TOKEN needs none.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          # Narrow the token to what release-please needs — without these the
          # token inherits every permission the App holds on the installation.
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes exactly the packages this run released, from the release commit
  # release-please just tagged. One job rather than a matrix: a grouped release
  # tags every package at once, and they share one install and one build.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's trusted publishing: the registry mints the credential from this
      # OIDC token, so there is no npm token to hold, and the published version
      # carries a provenance attestation tied to this workflow and commit.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0 # git hooks are for developer machines, not CI

      # Builds, then publishes in dependency order, skipping any version already
      # on the registry — see the script for why none of the three is optional.
      - name: Publish to npm
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: bun scripts/publish.ts
